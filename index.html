<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-font="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>soon messenger – Ultimate Edition</title>
  <style>
    :root[data-theme="dark"] {
      --bg-main: #0b0f19; --bg-panel: rgba(17, 24, 39, 0.85); --bg-sidebar: rgba(13, 18, 30, 0.95);
      --border-color: rgba(255, 255, 255, 0.06); --text-main: #f3f4f6; --text-muted: #9ca3af;
      --accent: #6366f1; --my-msg: linear-gradient(135deg, #6366f1, #8b5cf6); --other-msg: rgba(255, 255, 255, 0.06);
    }
    :root[data-theme="light"] {
      --bg-main: #f8fafc; --bg-panel: rgba(255, 255, 255, 0.9); --bg-sidebar: rgba(241, 245, 249, 0.95);
      --border-color: rgba(0, 0, 0, 0.06); --text-main: #0f172a; --text-muted: #64748b;
      --accent: #4f46e5; --my-msg: linear-gradient(135deg, #4f46e5, #6366f1); --other-msg: rgba(0, 0, 0, 0.04);
    }
    :root[data-theme="midnight"] {
      --bg-main: #000000; --bg-panel: #0a0a0a; --bg-sidebar: #050505;
      --border-color: rgba(255, 255, 255, 0.1); --text-main: #ffffff; --text-muted: #777777;
      --accent: #3b82f6; --my-msg: linear-gradient(135deg, #2563eb, #7c3aed); --other-msg: rgba(255, 255, 255, 0.08);
    }

    :root[data-font="small"] { --msg-font: 12px; }
    :root[data-font="medium"] { --msg-font: 13.5px; }
    :root[data-font="large"] { --msg-font: 15px; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-main); height: 100vh; height: 100dvh;
      display: flex; justify-content: center; align-items: center;
      color: var(--text-main); overflow: hidden; transition: background 0.3s;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px); display: flex; justify-content: center; align-items: center;
      z-index: 999; opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-box {
      background: var(--bg-panel); padding: 32px 24px; border-radius: 20px;
      border: 1px solid var(--border-color); width: 100%; max-width: 360px; text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); max-height: 90vh; overflow-y: auto;
    }
    .modal-box h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
    .modal-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    
    .modal-box input, .modal-box select {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border-color); background: rgba(255,255,255,0.03);
      color: var(--text-main); outline: none; margin-bottom: 12px; font-size: 14px;
    }
    .color-picker-group { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; justify-content: space-between; font-size: 13px; color: var(--text-muted); }
    .color-picker-group input[type="color"] { width: 36px; height: 32px; border: none; border-radius: 8px; cursor: pointer; background: transparent; }

    .modal-btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none;
      background: var(--accent); color: white; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .cancel-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); margin-top: 8px; }

    .image-modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.25s;
    }
    .image-modal.active { opacity: 1; pointer-events: auto; }
    .image-modal img, .image-modal video { max-width: 90%; max-height: 90%; border-radius: 12px; }

    .app-container {
      width: 100%; max-width: 960px; height: 100%; max-height: 720px;
      background: var(--bg-panel); backdrop-filter: blur(20px); border-radius: 20px;
      display: flex; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); overflow: hidden;
      border: 1px solid var(--border-color); z-index: 1; position: relative;
    }

    .sidebar-backdrop { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 9; }
    .sidebar-backdrop.active { display: block; }

    .sidebar {
      width: 270px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; padding: 16px; transition: 0.3s; z-index: 10;
    }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand-title { font-weight: 700; font-size: 17px; color: var(--text-main); }
    
    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-color);
      color: var(--text-main); width: 32px; height: 32px; border-radius: 10px; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.08); }

    .section-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin: 12px 0 6px; }
    
    .rooms-list, .users-list { display: flex; flex-direction: column; gap: 4px; max-height: 130px; overflow-y: auto; }
    .room-item, .user-row {
      padding: 8px 10px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .room-item.active { background: rgba(99, 102, 241, 0.12); color: var(--text-main); font-weight: 600; }
    .user-row { cursor: default; }
    .user-status-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; }

    .user-profile-badge {
      margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-color);
      display: flex; align-items: center; gap: 10px; cursor: pointer;
    }
    .profile-avatar { width: 34px; height: 34px; border-radius: 10px; background-size: cover; flex-shrink: 0; }
    .profile-info { display: flex; flex-direction: column; min-width: 0; }
    .profile-name { font-size: 13px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-bio { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chat-area { flex: 1; display: flex; flex-direction: column; width: 100%; min-width: 0; position: relative; }
    
    .chat-header {
      padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; padding: 4px; }
    .current-room-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .header-right-actions { display: flex; gap: 6px; align-items: center; }
    .search-input-box {
      display: none; background: rgba(255,255,255,0.04); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 4px 8px; color: var(--text-main); font-size: 12px; outline: none; width: 130px;
    }
    .search-input-box.active { display: block; }

    /* Закрепленное сообщение */
    .pinned-banner {
      background: rgba(99, 102, 241, 0.08); border-bottom: 1px solid var(--border-color);
      padding: 6px 16px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: var(--text-muted);
    }
    .pinned-banner b { color: var(--text-main); }

    .chat-window { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .system-message {
      align-self: center; font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.03);
      padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border-color); text-align: center;
    }

    .message-wrapper { display: flex; gap: 8px; max-width: 80%; position: relative; animation: fadeIn 0.2s ease-out; }
    .message-wrapper.other { align-self: flex-start; }
    .message-wrapper.my { align-self: flex-end; flex-direction: row-reverse; }
    .message-wrapper.search-match .message { border: 1px solid var(--accent); }

    .avatar { width: 30px; height: 30px; border-radius: 9px; background-size: cover; flex-shrink: 0; }
    .message-content { display: flex; flex-direction: column; position: relative; max-width: 100%; }

    .username { font-size: 11px; margin-bottom: 2px; font-weight: 600; }
    .message-wrapper.my .username { text-align: right; }

    .message {
      padding: 9px 13px; border-radius: 14px; font-size: var(--msg-font); line-height: 1.4; word-break: break-word; position: relative; cursor: pointer;
    }
    .message-wrapper.other .message { background: var(--other-msg); color: var(--text-main); border-top-left-radius: 4px; }
    .message-wrapper.my .message { background: var(--my-msg); color: #fff; border-top-right-radius: 4px; }

    /* Спойлеры */
    .spoiler {
      background: rgba(255,255,255,0.15); color: transparent; border-radius: 4px; padding: 0 4px; cursor: pointer; user-select: none; transition: 0.2s;
    }
    .spoiler.revealed { background: transparent; color: inherit; user-select: text; }

    /* Опросы */
    .poll-container { display: flex; flex-direction: column; gap: 6px; min-width: 180px; }
    .poll-question { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    .poll-option-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; text-align: left; display: flex; justify-content: space-between; transition: 0.2s;
    }
    .poll-option-btn:hover { background: rgba(255,255,255,0.1); }

    .chat-img, .chat-video { max-width: 220px; max-height: 220px; border-radius: 10px; cursor: pointer; margin-top: 2px; display: block; object-fit: cover; }
    .chat-audio { margin-top: 2px; max-width: 200px; height: 32px; outline: none; }

    .reply-preview-box {
      background: rgba(0,0,0,0.1); border-left: 2px solid var(--accent); padding: 3px 6px; margin-bottom: 4px; border-radius: 4px; font-size: 11px; color: var(--text-muted);
    }

    .replying-bar {
      display: none; padding: 8px 14px; background: rgba(0,0,0,0.15); border-top: 1px solid var(--border-color);
      justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted);
    }
    .replying-bar.active { display: flex; }
    .cancel-reply { cursor: pointer; font-weight: bold; color: #ef4444; }

    .reaction-picker {
      position: absolute; top: -32px; background: var(--bg-panel); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 2px 6px; display: flex; gap: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none; transition: 0.2s; z-index: 5;
    }
    .message-wrapper.other .reaction-picker { left: 0; }
    .message-wrapper.my .reaction-picker { right: 0; }
    .message-wrapper:hover .reaction-picker, .message-wrapper.active-picker .reaction-picker { opacity: 1; pointer-events: auto; transform: translateY(-4px); }
    .reaction-btn { background: transparent; border: none; font-size: 13px; cursor: pointer; padding: 2px; }

    .reactions-badge-container { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
    .message-wrapper.my .reactions-badge-container { justify-content: flex-end; }
    .reaction-badge { font-size: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); padding: 1px 5px; border-radius: 8px; }

    .message-time { font-size: 9px; color: var(--text-muted); margin-top: 2px; align-self: flex-end; }
    .message-wrapper.my .message-time { align-self: flex-start; color: rgba(255, 255, 255, 0.6); }
    .edited-tag { font-size: 9px; opacity: 0.6; margin-left: 3px; }

    .typing-indicator { font-size: 11px; color: var(--accent); padding: 0 16px 4px; height: 16px; font-style: italic; }

    .chat-form { display: flex; padding: 10px 14px; background: var(--bg-panel); border-top: 1px solid var(--border-color); gap: 8px; align-items: center; }
    .chat-form input[type="text"] {
      flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.03);
      color: var(--text-main); border-radius: 12px; outline: none; font-size: 13.5px; min-width: 0;
    }
    .media-btn {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); color: var(--text-main);
      width: 36px; height: 36px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s;
    }
    .media-btn.recording { background: #ef4444 !important; color: white !important; border-color: transparent; }
    .submit-btn { padding: 0 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; height: 36px; font-size: 13px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .app-container { border-radius: 0; height: 100%; max-height: 100dvh; border: none; }
      .mobile-menu-btn { display: flex; }
      .sidebar { position: absolute; top: 0; left: 0; height: 100%; width: 250px; transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
      .sidebar.mobile-open { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <!-- Авторизация (с поддержкой localStorage) -->
  <div id="login-overlay" class="modal-overlay">
    <div class="modal-box">
      <h2>soon.</h2>
      <p>Вход в защищенный чат</p>
      <form id="login-form">
        <input type="text" id="username-input" placeholder="Никнейм..." required maxlength="15" autocomplete="off" />
        <input type="password" id="password-input" placeholder="Пароль..." required autocomplete="off" />
        <input type="text" id="bio-input" placeholder="Статус..." maxlength="25" autocomplete="off" />
        <div class="color-picker-group">
          <span>Цвет ника:</span>
          <input type="color" id="color-input" value="#6366f1" />
        </div>
        <button type="submit" class="modal-btn">Войти</button>
      </form>
    </div>
  </div>

  <!-- Модалка профиля -->
  <div id="profile-overlay" class="modal-overlay">
    <div class="modal-box">
      <h2>Профиль</h2>
      <p>Настройки аккаунта</p>
      <form id="profile-form">
        <input type="text" id="edit-username-input" placeholder="Ник..." required maxlength="15" />
        <input type="text" id="edit-bio-input" placeholder="Статус..." maxlength="25" />
        <div class="color-picker-group">
          <span>Цвет ника:</span>
          <input type="color" id="edit-color-input" value="#6366f1" />
        </div>
        <button type="submit" class="modal-btn">Сохранить</button>
        <button type="button" id="close-profile-modal" class="modal-btn cancel-btn">Отмена</button>
      </form>
    </div>
  </div>

  <!-- Создание опроса -->
  <div id="poll-overlay" class="modal-overlay">
    <div class="modal-box">
      <h2>Создать опрос</h2>
      <form id="poll-form">
        <input type="text" id="poll-question-input" placeholder="Вопрос..." required maxlength="40" />
        <input type="text" id="poll-opt1-input" placeholder="Вариант 1..." required maxlength="25" />
        <input type="text" id="poll-opt2-input" placeholder="Вариант 2..." required maxlength="25" />
        <button type="submit" class="modal-btn">Запустить опрос</button>
        <button type="button" id="close-poll-modal" class="modal-btn cancel-btn">Отмена</button>
      </form>
    </div>
  </div>

  <!-- Новый чат -->
  <div id="room-overlay" class="modal-overlay">
    <div class="modal-box">
      <h2>Новый чат</h2>
      <form id="room-form">
        <input type="text" id="new-room-input" placeholder="Название комнаты..." required maxlength="20" autocomplete="off" />
        <button type="submit" class="modal-btn">Перейти</button>
        <button type="button" id="close-room-modal" class="modal-btn cancel-btn">Отмена</button>
      </form>
    </div>
  </div>

  <div class="image-modal" id="image-modal"><div id="media-container-full"></div></div>

  <div class="app-container">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">soon messenger</div>
        <div class="header-actions">
          <button class="icon-btn" id="theme-switch-btn" title="Сменить тему">🎨</button>
          <button class="icon-btn" id="open-room-btn" title="Новый чат">+</button>
        </div>
      </div>

      <div class="section-label">Чаты</div>
      <div class="rooms-list" id="rooms-list">
        <div class="room-item active" data-room="general"><span>🌐</span><span>Общий чат</span></div>
      </div>

      <div class="section-label">Участники онлайн</div>
      <div class="users-list" id="users-list"></div>

      <div class="user-profile-badge" id="open-profile-btn">
        <div class="profile-avatar" id="my-profile-avatar"></div>
        <div class="profile-info">
          <div class="profile-name" id="my-profile-name">Гость</div>
          <div class="profile-bio" id="my-profile-bio">В сети</div>
        </div>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
          <div class="current-room-title" id="current-room-title">Общий чат</div>
        </div>
        <div class="header-right-actions">
          <input type="text" id="search-input" class="search-input-box" placeholder="Поиск..." />
          <button class="icon-btn" id="search-toggle-btn" title="Поиск">🔍</button>
          <button class="icon-btn" id="open-poll-btn" title="Создать опрос">📊</button>
        </div>
      </div>

      <!-- Баннер закрепа -->
      <div class="pinned-banner" id="pinned-banner" style="display: none;">
        <div>📌 Закреп: <b id="pinned-text"></b></div>
        <span style="cursor: pointer;" id="unpin-btn" title="Открепить">✕</span>
      </div>

      <div id="chat-window" class="chat-window"></div>
      <div id="typing-indicator" class="typing-indicator"></div>

      <div class="replying-bar" id="replying-bar">
        <div>Ответ на: <span id="replying-to-text" style="font-weight: 600;"></span></div>
        <span class="cancel-reply" id="cancel-reply">✕</span>
      </div>

      <form id="chat-form" class="chat-form">
        <input type="file" id="file-input" accept="image/*,video/*" style="display: none;" />
        <button type="button" class="media-btn" id="attach-btn" title="Файл">📎</button>
        <button type="button" class="media-btn mic-btn" id="mic-btn" title="Голосовое">🎤</button>
        <input type="text" id="message-input" placeholder="Сообщение (используйте ||спойлер||)..." autocomplete="off" />
        <button type="submit" class="submit-btn">➤</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myUsername = '';
    let myBio = '';
    let myColor = '#6366f1';
    let myAvatar = '';
    let currentRoom = 'general';
    let replyingTo = null;
    let editingMsgId = null;
    let activePinnedMsg = null;

    const themes = ['dark', 'light', 'midnight'];
    let currentThemeIdx = 0;

    document.getElementById('theme-switch-btn').addEventListener('click', () => {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      document.documentElement.setAttribute('data-theme', themes[currentThemeIdx]);
    });

    // Автопроверка сохраненного профиля в LocalStorage
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('soon_user');
      if (savedUser) {
        const data = JSON.parse(savedUser);
        myUsername = data.name;
        myBio = data.bio;
        myColor = data.color;
        myAvatar = data.avatar;
        updateProfileBadge();
        socket.emit('user join', { name: myUsername, avatar: myAvatar, color: myColor, status: myBio, room: 'general' });
        document.getElementById('login-overlay').classList.remove('active');
      } else {
        document.getElementById('login-overlay').classList.add('active');
      }
    });

    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('username-input').value.trim();
      if (name) {
        myUsername = name;
        myBio = document.getElementById('bio-input').value.trim() || 'В сети';
        myColor = document.getElementById('color-input').value;
        myAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(myUsername)}`;
        
        localStorage.setItem('soon_user', JSON.stringify({ name: myUsername, bio: myBio, color: myColor, avatar: myAvatar }));
        updateProfileBadge();
        socket.emit('user join', { name: myUsername, avatar: myAvatar, color: myColor, status: myBio, room: 'general' });
        document.getElementById('login-overlay').classList.remove('active');
      }
    });

    const profileOverlay = document.getElementById('profile-overlay');
    document.getElementById('open-profile-btn').addEventListener('click', () => {
      document.getElementById('edit-username-input').value = myUsername;
      document.getElementById('edit-bio-input').value = myBio;
      document.getElementById('edit-color-input').value = myColor;
      profileOverlay.classList.add('active');
    });
    document.getElementById('close-profile-modal').addEventListener('click', () => profileOverlay.classList.remove('active'));

    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();
      myUsername = document.getElementById('edit-username-input').value.trim();
      myBio = document.getElementById('edit-bio-input').value.trim() || 'В сети';
      myColor = document.getElementById('edit-color-input').value;
      localStorage.setItem('soon_user', JSON.stringify({ name: myUsername, bio: myBio, color: myColor, avatar: myAvatar }));
      updateProfileBadge();
      profileOverlay.classList.remove('active');
    });

    function updateProfileBadge() {
      document.getElementById('my-profile-name').textContent = myUsername;
      document.getElementById('my-profile-bio').textContent = myBio;
      document.getElementById('my-profile-name').style.color = myColor;
      document.getElementById('my-profile-avatar').style.backgroundImage = `url('${myAvatar}')`;
    }

    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    document.getElementById('mobile-menu-btn').addEventListener('click', () => { sidebar.classList.add('mobile-open'); sidebarBackdrop.classList.add('active'); });
    sidebarBackdrop.addEventListener('click', () => { sidebar.classList.remove('mobile-open'); sidebarBackdrop.classList.remove('active'); });

    const roomOverlay = document.getElementById('room-overlay');
    document.getElementById('open-room-btn').addEventListener('click', () => { document.getElementById('new-room-input').value = ''; roomOverlay.classList.add('active'); });
    document.getElementById('close-room-modal').addEventListener('click', () => roomOverlay.classList.remove('active'));

    document.getElementById('room-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const targetRoom = document.getElementById('new-room-input').value.trim().toLowerCase();
      if (targetRoom) {
        if (targetRoom === currentRoom) return;
        currentRoom = targetRoom;
        socket.emit('change room', currentRoom);
        document.getElementById('chat-window').innerHTML = '';
        document.getElementById('current-room-title').textContent = currentRoom;
        sidebar.classList.remove('mobile-open');
        sidebarBackdrop.classList.remove('active');
      }
      roomOverlay.classList.remove('active');
    });

    // Опросы модалка
    const pollOverlay = document.getElementById('poll-overlay');
    document.getElementById('open-poll-btn').addEventListener('click', () => pollOverlay.classList.add('active'));
    document.getElementById('close-poll-modal').addEventListener('click', () => pollOverlay.classList.remove('active'));

    document.getElementById('poll-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('poll-question-input').value;
      const opt1 = document.getElementById('poll-opt1-input').value;
      const opt2 = document.getElementById('poll-opt2-input').value;
      
      emitPayload({
        type: 'poll',
        poll: { question: q, options: [{ text: opt1, votes: [] }, { text: opt2, votes: [] }] }
      });

      document.getElementById('poll-question-input').value = '';
      document.getElementById('poll-opt1-input').value = '';
      document.getElementById('poll-opt2-input').value = '';
      pollOverlay.classList.remove('active');
    });

    // Поиск сообщений
    const searchToggleBtn = document.getElementById('search-toggle-btn');
    const searchInput = document.getElementById('search-input');
    searchToggleBtn.addEventListener('click', () => {
      searchInput.classList.toggle('active');
      if (searchInput.classList.contains('active')) searchInput.focus();
    });

    searchInput.addEventListener('input', () => {
      const term = searchInput.value.toLowerCase();
      document.querySelectorAll('.message-wrapper').forEach(w => {
        const textEl = w.querySelector('.msg-text');
        if (textEl && textEl.textContent.toLowerCase().includes(term) && term.length > 0) {
          w.classList.add('search-match');
          w.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          w.classList.remove('search-match');
        }
      });
    });

    // Отправка файлов и медиа
    const fileInput = document.getElementById('file-input');
    document.getElementById('attach-btn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (evt) => {
          if (file.type.startsWith('image/')) emitPayload({ type: 'image', mediaUrl: evt.target.result });
          else if (file.type.startsWith('video/')) emitPayload({ type: 'video', mediaUrl: evt.target.result });
        };
        reader.readAsDataURL(file);
      }
      fileInput.value = '';
    });

    // Голосовые
    let mediaRecorder, audioChunks = [], isRecording = false;
    const micBtn = document.getElementById('mic-btn');
    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = (evt) => emitPayload({ type: 'audio', mediaUrl: evt.target.result });
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start(); isRecording = true; micBtn.classList.add('recording');
        } catch(e) { alert('Нет доступа к микрофону'); }
      } else {
        mediaRecorder.stop(); isRecording = false; micBtn.classList.remove('recording');
      }
    });

    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const chatWindow = document.getElementById('chat-window');

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      if (editingMsgId) {
        socket.emit('edit message', { msgId: editingMsgId, newText: text });
        editingMsgId = null;
        messageInput.value = '';
        return;
      }

      emitPayload({
        type: 'text',
        text: text,
        replyTo: replyingTo ? { name: replyingTo.name, text: replyingTo.text } : null
      });

      messageInput.value = '';
      cancelReplyAction();
      socket.emit('typing', false);
    });

    function emitPayload(extraData) {
      const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      socket.emit('chat message', {
        msgId, name: myUsername, avatar: myAvatar, color: myColor, id: socket.id, ...extraData
      });
    }

    const replyingBar = document.getElementById('replying-bar');
    document.getElementById('cancel-reply').addEventListener('click', cancelReplyAction);
    function cancelReplyAction() {
      replyingTo = null;
      replyingBar.classList.remove('active');
    }

    let typingTimeout;
    messageInput.addEventListener('input', () => {
      socket.emit('typing', true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('typing', false), 2000);
    });

    // Обработка входящих сообщений
    socket.on('chat message', (data) => {
      renderMessage(data);
    });

    function renderMessage(data) {
      const isMy = data.id === socket.id;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const wrapper = document.createElement('div');
      wrapper.classList.add('message-wrapper', isMy ? 'my' : 'other');
      wrapper.setAttribute('data-msg-id', data.msgId);

      let pickerHtml = '<div class="reaction-picker">';
      ['👍', '❤️', '🔥', '😂', '😮'].forEach(emoji => {
        pickerHtml += `<button class="reaction-btn" onclick="sendReaction('${data.msgId}', '${emoji}')">${emoji}</button>`;
      });
      pickerHtml += '</div>';

      let replyHtml = data.replyTo ? `<div class="reply-preview-box"><b>${data.replyTo.name}</b>: ${data.replyTo.text}</div>` : '';

      let bodyHtml = '';
      if (data.type === 'image') {
        bodyHtml = `<img src="${data.mediaUrl}" class="chat-img" onclick="openFullMedia('image', '${data.mediaUrl}')" />`;
      } else if (data.type === 'video') {
        bodyHtml = `<video src="${data.mediaUrl}" class="chat-video" controls></video>`;
      } else if (data.type === 'audio') {
        bodyHtml = `<audio src="${data.mediaUrl}" controls class="chat-audio"></audio>`;
      } else if (data.type === 'poll') {
        bodyHtml = createPollHtml(data.msgId, data.poll);
      } else {
        // Парсинг спойлеров ||текст||
        let parsedText = data.text.replace(/\|\|(.*?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
        bodyHtml = `<span class="msg-text">${parsedText}</span><span class="edited-tag"></span>`;
      }

      wrapper.innerHTML = `
        <div class="avatar" style="background-image: url('${data.avatar}')"></div>
        <div class="message-content">
          ${pickerHtml}
          <div class="username" style="color: ${data.color}">${data.name}</div>
          <div class="message">
            ${replyHtml}
            ${bodyHtml}
          </div>
          <div class="reactions-badge-container" id="reactions-${data.msgId}"></div>
          <div class="message-time">${time}</div>
        </div>
      `;

      const msgBubble = wrapper.querySelector('.message');
      msgBubble.addEventListener('click', (e) => {
        if (['IMG', 'VIDEO', 'AUDIO', 'SPAN', 'BUTTON'].includes(e.target.tagName)) return;
        e.stopPropagation();
        
        if (isMy && data.type === 'text') {
          editingMsgId = data.msgId;
          messageInput.value = wrapper.querySelector('.msg-text').textContent;
          messageInput.focus();
        } else {
          replyingTo = { name: data.name, text: data.type === 'text' ? data.text : '[Медиа]' };
          document.getElementById('replying-to-text').textContent = `${replyingTo.name}: ${replyingTo.text}`;
          replyingBar.classList.add('active');
          messageInput.focus();
        }
      });

      // Добавим меню закрепления по долгому клику или контексту (двойной клик)
      msgBubble.addEventListener('dblclick', () => {
        socket.emit('pin message', { msgId: data.msgId, text: data.type === 'text' ? data.text : '[Медиафайл]', name: data.name });
      });

      chatWindow.appendChild(wrapper);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function createPollHtml(msgId, poll) {
      let html = `<div class="poll-container" data-poll-id="${msgId}"><div class="poll-question">📊 ${poll.question}</div>`;
      poll.options.forEach((opt, idx) => {
        const totalVotes = poll.options.reduce((sum, o) => sum + o.votes.length, 0);
        const percent = totalVotes > 0 ? Math.round((opt.votes.length / totalVotes) * 100) : 0;
        html += `<button class="poll-option-btn" onclick="votePoll('${msgId}', ${idx})"><span>${opt.text}</span> <span>${percent}% (${opt.votes.length})</span></button>`;
      });
      html += `</div>`;
      return html;
    }

    window.votePoll = (msgId, optIdx) => {
      socket.emit('vote poll', { msgId, optIdx, user: myUsername });
    };

    socket.on('update poll', (data) => {
      // Обновление голосов опроса в реальном времени (простейшая логика)
      const container = document.querySelector(`[data-poll-id="${data.msgId}"]`);
      if (container) {
        // Перерисовываем блок при желании или обновляем данные
      }
    });

    socket.on('pinned message', (pin) => {
      const banner = document.getElementById('pinned-banner');
      if (pin) {
        activePinnedMsg = pin;
        document.getElementById('pinned-text').textContent = `${pin.name}: ${pin.text}`;
        banner.style.display = 'flex';
      } else {
        banner.style.display = 'none';
      }
    });

    document.getElementById('unpin-btn').addEventListener('click', () => {
      socket.emit('pin message', null);
    });

    socket.on('edit message', (data) => {
      const wrapper = document.querySelector(`[data-msg-id="${data.msgId}"]`);
      if (wrapper) {
        const textSpan = wrapper.querySelector('.msg-text');
        const tagSpan = wrapper.querySelector('.edited-tag');
        if (textSpan) textSpan.textContent = data.newText;
        if (tagSpan) tagSpan.textContent = '(изменено)';
      }
    });

    function openFullMedia(type, url) {
      const container = document.getElementById('media-container-full');
      container.innerHTML = type === 'image' ? `<img src="${url}" />` : `<video src="${url}" controls autoplay></video>`;
      document.getElementById('image-modal').classList.add('active');
    }
    document.getElementById('image-modal').addEventListener('click', () => document.getElementById('image-modal').classList.remove('active'));

    window.sendReaction = (msgId, emoji) => socket.emit('add reaction', { msgId, emoji, user: myUsername });

    socket.on('update reaction', (data) => {
      const { msgId, emoji, user } = data;
      // Логика реакций
    });

    socket.on('system message', (text) => {
      const div = document.createElement('div');
      div.classList.add('system-message');
      div.textContent = text;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    });

    socket.on('update users list', (users) => {
      const uList = document.getElementById('users-list');
      uList.innerHTML = '';
      users.forEach(u => {
        const row = document.createElement('div');
        row.classList.add('user-row');
        row.innerHTML = `<div class="user-status-dot"></div><span style="color: ${u.color}">${u.name}</span>`;
        uList.appendChild(row);
      });
    });

    socket.on('typing status', (names) => {
      const ind = document.getElementById('typing-indicator');
      if (names.length > 0) {
        ind.textContent = names.join(', ') + (names.length > 1 ? ' печатают...' : ' печатает...');
      } else {
        ind.textContent = '';
      }
    });
  </script>
</body>
</html>
